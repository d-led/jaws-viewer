name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets the checks be run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # The build script typechecks before bundling, so this covers both.
      - name: Production build
        run: npm run build

      - name: Check the sample came through the build
        run: npm run sample:check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs the desktop and phone projects against the built app, served by `vite preview`.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the report when something fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
